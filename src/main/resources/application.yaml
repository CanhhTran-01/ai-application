server:
  port: 8080

spring:
  application:
    name: ai-application
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.6-flash

        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768 # match với embedding model (kết hợp MRL)

    vectorstore:
      pgvector:
        dimensions: 768 # số chiều vector (match với model embedding)
        index-type: hnsw # kiểu Index phục vụ tìm kiếm vector tương tự trong DB
        distance-type: cosine_distance # đo độ tương đồng bằng khoảng cách cô-sin
        initialize-schema: false # Flyway quản lý schema

kma:
  ai:
    # Trợ lý học vụ
    assistant:
      system-prompt: |
        Bạn là trợ lý học vụ của KMA Smart Edu.
        Bạn được phép dùng hai nguồn thông tin:
        1. Phần thông tin tham khảo kèm theo câu hỏi, dùng cho câu hỏi liên quan.
        2. Công cụ tra cứu điểm, dùng khi sinh viên hỏi về điểm của CHÍNH MÌNH.
        Nếu không nguồn nào chứa câu trả lời, hãy nói đúng câu:
        "Tôi không tìm thấy thông tin này liên quan hiện có, vui lòng liên hệ phòng đào tạo."
        Không suy đoán, không dùng kiến thức bên ngoài.
        Bạn chỉ tra cứu được điểm của chính người đang hỏi; nếu được nhờ xem điểm của người khác, hãy từ chối lịch sự.
        Trả lời ngắn gọn bằng tiếng Việt.
      temperature: 0.2
      max-tokens: 1024
      similarity-threshold: 0.70
      top-k: 3

    # Sinh trắc nghiệm với 4 cấp độ: nhận biết - thông hiểu - vận dụng - vận dụng cao
    quiz:
      system-prompt: |
        Bạn là công cụ tạo câu hỏi trắc nghiệm cho môn học kỹ thuật, trả lời bằng tiếng Việt.
        Mỗi câu hỏi phải có đúng 4 đáp án, chỉ 1 đáp án đúng.

        Trước khi đưa câu hỏi cuối cùng, hãy tự kiểm tra (không hiện ra):
        1. Chỉ có đúng 1 đáp án chính xác trong 4 lựa chọn ?
        2. Câu hỏi rõ ràng, không gây hiểu nhầm, đúng cấp độ yêu cầu ?
        Nếu phát hiện vấn đề, tự sửa lại trước khi xuất kết quả.

        Yêu cầu: 
        Tạo {count} câu hỏi về chủ đề "{topic}", theo đúng cấp độ: {level}.
        Chỉ được dùng nội dung trong phần TÀI LIỆU dưới đây để ra câu hỏi, đáp án và giải thích. Không dùng kiến thức bên ngoài.
        Nếu tài liệu không đủ để ra {count} câu thì ra ít hơn, tuyệt đối không bịa.
        TÀI LIỆU:
        {context}.
      temperature: 0.7
      max-tokens: 2048
      top-k: 5
      similarity-threshold: 0.65
