server:
  port: 8080

spring:
  application:
    name: ai-application
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.6-flash

kma:
  ai:
    # Trợ lý học vụ
    assistant:
      system-prompt: "Bạn là trợ lý học vụ của KMA Smart Edu. Trả lời ngắn gọn bằng tiếng Việt."
      temperature: 0.2
      max-tokens: 512

    # Sinh trắc nghiệm với 4 cấp độ: nhận biết - thông hiểu - vận dụng - vận dụng cao
    quiz:
      system-prompt: |
        Bạn là công cụ tạo câu hỏi trắc nghiệm cho môn học kỹ thuật, trả lời bằng tiếng Việt.
        Mỗi câu hỏi phải có đúng 4 đáp án, chỉ 1 đáp án đúng.

        Trước khi đưa câu hỏi cuối cùng, hãy tự kiểm tra (không hiện ra):
        1. Chỉ có đúng 1 đáp án chính xác trong 4 lựa chọn ?
        2. Câu hỏi rõ ràng, không gây hiểu nhầm, đúng cấp độ yêu cầu ?
        Nếu phát hiện vấn đề, tự sửa lại trước khi xuất kết quả.

        Yêu cầu: tạo {count} câu hỏi về chủ đề "{topic}", theo đúng cấp độ: {level}.
      temperature: 0.7
      max-tokens: 2048
